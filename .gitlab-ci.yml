image: node:22

stages:
  - check
  - e2e
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

default:
  before_script:
    - npm ci

typecheck:
  stage: check
  script:
    - npm run typecheck

test:
  stage: check
  script:
    - npm test

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
